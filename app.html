<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e1b4b">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<title>چک‌لیست ارزیابی انرژی ساختمان — روش تجویزی</title>
<style>
:root{
  --bg:#edf3f2; --surface:#fff; --surface-2:#f7fbfa; --text:#1f2d2b; --muted:#607d8b;
  --primary:#00796b; --primary-2:#004d40; --cyan:#00838f; --border:#cfe0dd;
  --ok:#2e7d32; --ok-bg:#f0faf1; --danger:#c62828; --danger-bg:#fff5f5;
  --warn:#e65100; --warn-bg:#fff7ed; --info:#0d47a1; --info-bg:#eef7ff;
  --shadow:0 10px 28px rgba(28,60,58,.08); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
body{font-size:15px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(110deg,#00695c,#00838f);color:#fff;box-shadow:0 8px 20px rgba(0,77,64,.14);padding:16px 20px 14px;position:sticky;top:0;z-index:20}
.header-inner{width:min(1180px,100%);margin:auto}
.brand{font-weight:800;font-size:clamp(18px,2.2vw,24px);line-height:1.6}
.step-line{margin-top:2px;font-size:13px;opacity:.92;min-height:22px}
.progress{height:9px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:9px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#80cbc4,#b2dfdb);border-radius:999px;transition:width .25s ease}
.content-wrap{flex:1;padding:20px 12px 110px}
.page{width:min(100%,1120px);margin:0 auto}
.top-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.phase{padding:7px 11px;border:1px solid var(--border);background:#fff;border-radius:999px;color:var(--muted);font-size:12px}
.phase.active{background:#e0f2f1;color:var(--primary-2);border-color:#80cbc4;font-weight:800}
.phase.done{background:#f1f8f4;color:var(--ok);border-color:#b7dfbd}
.title{color:#004d40;font-size:clamp(21px,2.8vw,28px);font-weight:900;line-height:1.55;margin:5px 0 3px}
.subtitle{color:#546e7a;line-height:1.9;margin:0 0 15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin:11px 0;box-shadow:var(--shadow)}
.card.bad{border:2px solid #e53935;background:var(--danger-bg)}
.card.ok{border-color:#a5d6a7;background:var(--ok-bg)}
.card.fail{border-color:#ef9a9a;background:#fffafa}
.card-head{display:flex;gap:10px;align-items:flex-start}
.num{background:#e0f2f1;color:#00695c;border-radius:999px;padding:3px 10px;font-weight:800;min-width:34px;text-align:center;line-height:1.5;flex:none}
.qtext{font-weight:800;line-height:1.9;flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:9px;font-size:12px;border:1px solid transparent}
.badge.climate{background:#fff3e0;color:#e65100;border-color:#ffb74d}
.badge.mand{background:#ffebee;color:#b71c1c;border-color:#ef9a9a}
.badge.info{background:#e0f2f1;color:#004d40;border-color:#80cbc4}
.help,.muted{color:var(--muted);line-height:1.85;margin-top:9px}
.hint{color:var(--info);line-height:1.85;margin-top:9px;white-space:pre-line}
.status{margin-top:9px;font-weight:800;line-height:1.8}
.status.ok{color:var(--ok)} .status.fail{color:var(--danger)} .status.hint{color:var(--info)}
.ref{color:#607d8b;font-size:12px;line-height:1.8;margin-top:8px}
.input-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:12px}
.choice{background:#fff;border:2px solid #b0c4c0;border-radius:12px;padding:11px 12px;min-height:46px;text-align:center;color:var(--text);transition:.15s ease;line-height:1.65}
.choice:hover{border-color:#00838f;transform:translateY(-1px)}
.choice.selected{background:#00796b;border-color:#00796b;color:#fff;font-weight:800}
.choice:disabled{opacity:.5;cursor:not-allowed;transform:none}
.group-title{display:inline-block;background:#e0f2f1;color:#004d40;border:1px solid #80cbc4;border-radius:9px;padding:4px 9px;font-size:12px;font-weight:800;margin:10px 0 6px}
.number-input{width:min(100%,340px);border:2px solid #b0c4c0;border-radius:10px;padding:10px 12px;background:#fff;outline:none;direction:ltr;text-align:right}
.number-input:focus,.select:focus{border-color:#00838f;box-shadow:0 0 0 4px rgba(0,131,143,.1)}
.number-input:disabled{background:#eceff1}
.select{width:min(100%,420px);border:2px solid #b0c4c0;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.unit{color:var(--muted);font-size:13px}
.na{margin-top:12px;display:flex;align-items:center;gap:8px;color:#455a64;font-size:13px}
.na input{accent-color:var(--primary)}
.alert{border-radius:14px;padding:12px 14px;line-height:1.9;margin:12px 0}
.alert.info{background:var(--info-bg);border:1px solid #90caf9;color:#174f7d}
.alert.warn{background:var(--warn-bg);border:1px solid #ffb74d;color:#8a4b00}
.alert.danger{background:var(--danger-bg);border:1px solid #ef9a9a;color:#8e2525}
.nav-footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:30}
.nav-inner{width:min(1180px,100%);margin:auto;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.btn{border-radius:11px;border:1px solid transparent;padding:10px 18px;font-weight:800;transition:.15s ease}
.btn.primary{background:#00796b;color:#fff}.btn.primary:hover{background:#004d40}.btn.primary:disabled{background:#b0bec5;color:#eceff1;cursor:not-allowed}
.btn.ghost{background:transparent;color:#00695c;border-color:#80cbc4}.btn.ghost:hover{background:#e0f2f1}
.footer-msg{color:#c62828;font-weight:700;font-size:13px;line-height:1.7;min-height:20px}
.item-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.section-card{padding:12px;border:1px solid var(--border);border-radius:13px;background:#fff;margin:9px 0}
.section-row{display:grid;grid-template-columns:minmax(160px,260px) 1fr auto;gap:12px;align-items:center;margin:9px 0}
.meter{height:18px;border:1px solid #b0c4c0;border-radius:999px;overflow:hidden;background:#fff}
.meter span{display:block;height:100%;background:linear-gradient(90deg,#80cbc4,#26a69a);border-radius:999px}
.meter-label{font-size:12px;color:#455a64;white-space:nowrap}
.scorebox{padding:16px;border-radius:16px;margin-bottom:14px}
.scorebox.ok{background:#eef8f0;border:1px solid #a5d6a7}.scorebox.fail{background:#fff5f5;border:1px solid #ef9a9a}
.score-big{font-size:28px;font-weight:900;color:#004d40}
.gauge{position:relative;height:28px;border-radius:999px;background:#cfd8dc;overflow:visible;margin:23px 6px 28px}
.gauge-fill{height:100%;border-radius:999px;position:absolute;right:0;top:0}
.gauge-fill.ok{background:#2e7d32}.gauge-fill.fail{background:#c62828}
.gauge-mark{position:absolute;top:-7px;width:3px;height:42px;background:#263238}
.gauge-label{position:absolute;top:-27px;transform:translateX(50%);font-size:11px;color:#37474f;white-space:nowrap}
.gauge-ext{position:absolute;top:34px;font-size:11px;color:#37474f}.gauge-ext.right{right:0}.gauge-ext.left{left:0}
.report{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;line-height:1.95;box-shadow:var(--shadow);overflow:auto}
.report h2,.report h3{line-height:1.6}.report table{border-collapse:collapse;width:100%;margin:10px 0}.report td,.report th{border:1px solid #b0bec5;padding:7px}.report li{margin:5px 0}
.report .report-danger{color:#b71c1c}.report .report-ok{color:#1b5e20}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.image-toggle{border:1px solid #80cbc4;background:transparent;color:#00695c;border-radius:10px;padding:8px 11px;font-weight:700}
.image-box{margin-top:8px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:9px;display:none}.image-box.open{display:block}
.ref-image{display:block;width:100%;max-height:520px;object-fit:contain;cursor:zoom-in;border-radius:10px;background:#f5f7f7}
.modal{position:fixed;inset:0;background:rgba(18,29,28,.74);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal.open{display:flex}
.modal-card{width:min(1100px,100%);height:min(85vh,900px);background:#fff;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}.modal-bar{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.modal-title{font-weight:900;flex:1}.modal-view{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#e9eeee;padding:10px}.modal-view img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center}.zoom-btn{border:1px solid #80cbc4;background:#fff;color:#00695c;border-radius:9px;padding:7px 10px}.close-btn{border:1px solid #ef9a9a;background:#fff5f5;color:#b71c1c;border-radius:9px;padding:7px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#263238;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:80;max-width:min(90vw,700px);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.toast.show{display:block}
@media (max-width:720px){
  body{font-size:14px}.header{padding:13px 12px}.content-wrap{padding:14px 9px 105px}.card{padding:13px}.section-row{grid-template-columns:1fr;gap:7px}.nav-inner{grid-template-columns:1fr 1fr}.footer-msg{grid-column:1 / -1;grid-row:1}.nav-inner .prev{grid-column:1}.nav-inner .next{grid-column:2}.top-strip{gap:5px}.phase{font-size:11px;padding:6px 9px}.choice-grid{grid-template-columns:1fr}.modal{padding:8px}.modal-card{height:90vh}
}
@media print{
  body{background:#fff}.header,.nav-footer,.top-strip,.toolbar,.image-toggle,.image-box,.no-print{display:none!important}.content-wrap{padding:0}.report{border:none;box-shadow:none;padding:0}.scorebox{break-inside:avoid}
}

/* ===== Theme: navy / blue / purple, glass ===== */
:root{--bg:#eef0ff;--text:#1b2140;--muted:#5b6485;--primary:#4f46e5;--primary-2:#1e1b4b;--cyan:#2563eb;--border:rgba(99,102,241,.2);--shadow:0 10px 30px rgba(30,27,75,.10);--radius:20px;--grad:linear-gradient(120deg,#2563eb,#6d28d9)}
html,body{font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(900px 500px at 85% -5%,rgba(124,58,237,.16),transparent 60%),radial-gradient(800px 500px at 0% 10%,rgba(37,99,235,.14),transparent 60%),#eef0ff;background-attachment:fixed}
.header{background:linear-gradient(115deg,#0f1b4d,#312e81 55%,#5b21b6);box-shadow:0 10px 30px rgba(15,27,77,.25);border-bottom:1px solid rgba(255,255,255,.14)}
.progress>span{background:linear-gradient(90deg,#60a5fa,#c4b5fd)}
.phase{background:rgba(255,255,255,.7);backdrop-filter:blur(8px)}
.phase.active{background:#e0e7ff;color:#312e81;border-color:#a5b4fc}
.title{color:#1e1b4b}.subtitle{color:#4b5578}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.card.ok{background:rgba(240,253,244,.85);border-color:#86efac}.card.fail{background:rgba(255,247,247,.9);border-color:#fca5a5}
.num{background:#e0e7ff;color:#3730a3}
.badge.info,.group-title{background:#e0e7ff;color:#312e81;border-color:#a5b4fc}
.choice{border:2px solid #c7d2fe;border-radius:14px}
.choice:hover{border-color:#6366f1}
.choice.selected{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.number-input,.select,.text-input{border:2px solid #c7d2fe;border-radius:14px}
.text-input{width:min(100%,460px);padding:11px 13px;background:#fff;outline:none}
.number-input:focus,.select:focus,.text-input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.btn{border-radius:14px}
.btn.primary{background:var(--grad);box-shadow:0 8px 20px rgba(79,70,229,.28)}
.btn.primary:hover{background:var(--grad);filter:brightness(1.1)}.btn.primary:disabled{background:#b6bdd6;box-shadow:none}
.btn.ghost{color:#3730a3;border-color:#a5b4fc}.btn.ghost:hover{background:#e0e7ff}
.nav-footer{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(99,102,241,.2)}
.image-toggle{border-color:#a5b4fc;color:#3730a3;border-radius:12px}
.meter span{background:var(--grad)}
.report{background:rgba(255,255,255,.9)}
:focus-visible{outline:3px solid #6366f1;outline-offset:2px}
.field-card .help{white-space:pre-line}
.shared-view .nav-footer{display:none}.shared-view .content-wrap{padding-bottom:30px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.info-grid .card{margin:8px 0}@media(max-width:800px){.info-grid{grid-template-columns:1fr}}
@media print{body{background:#fff!important}.report{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== Password gate ===== */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 85% -5%,rgba(124,58,237,.35),transparent 60%),radial-gradient(800px 500px at 0% 10%,rgba(37,99,235,.35),transparent 60%),#0f1b4d}
#gate .gbox{width:100%;max-width:380px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 20px 50px rgba(15,27,77,.35);padding:26px 22px;text-align:center;color:#1b2140}
#gate h2{margin:0 0 6px;font-size:19px;color:#1e1b4b}#gate p{margin:0 0 16px;color:#5b6485;font-size:14px}
#gate input{width:100%;box-sizing:border-box;text-align:center;letter-spacing:6px;font-size:22px;padding:12px;border:2px solid #c7d2fe;border-radius:14px;background:#fff;color:#1b2140;font-family:inherit;direction:ltr}
#gate input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
#gate button{margin-top:14px;width:100%}
#gate .gerr{min-height:22px;margin-top:10px;color:#b71c1c;font-size:14px}
#gate.shake .gbox{animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-inner">
      <div class="brand">چک‌لیست ارزیابی انرژی ساختمان — روش تجویزی</div>
      <div class="step-line" id="stepLine"></div>
      <div class="progress"><span id="progressFill" style="width:0%"></span></div>
    </div>
  </header>
  <main class="content-wrap">
    <div class="page" id="app"></div>
  </main>
  <div class="nav-footer">
    <div class="nav-inner">
      <button class="btn primary prev" id="prevBtn">→ مرحله قبل</button>
      <div class="footer-msg" id="footerMsg"></div>
      <button class="btn primary next" id="nextBtn">مرحله بعد ←</button>
    </div>
  </div>
</div>
<div class="modal" id="imageModal">
  <div class="modal-card">
    <div class="modal-bar">
      <div class="modal-title" id="modalTitle"></div>
      <button class="zoom-btn" id="zoomIn">بزرگ‌نمایی +</button>
      <button class="zoom-btn" id="zoomOut">کوچک‌نمایی −</button>
      <button class="zoom-btn" id="zoomFit">متناسب با پنجره</button>
      <button class="close-btn" id="modalClose">بستن</button>
    </div>
    <div class="modal-view"><img id="modalImage" alt=""></div>
  </div>
</div>

<script>
'use strict';
const MODEL = JSON.parse(document.getElementById('model').textContent);
const NA = 'NA';
const state = {project:{}, gate:{}, climate:{}, profile:{}, answers:{}, steps:[], cur:'info', lastResult:null, lastHtml:''};
const $ = s => document.querySelector(s);
const app = $('#app');
const faDigits = '۰۱۲۳۴۵۶۷۸۹';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fa(s){
  s=String(s??'');
  s=s.replace(/(?<![A-Za-z\d])(\d+)\.(\d+)(?![A-Za-z])/g,'$1٫$2');
  s=s.replace(/(?<![A-Za-z])\d+(?:٫\d+)?(?![A-Za-z])/g,m=>m.split('').map(ch=>ch>='0'&&ch<='9'?faDigits[+ch]:ch).join(''));
  return s.split('\n').map(x=>x?'\u200f'+x:x).join('\n');
}
function fmt(v, nd=null){if(v==null||v==='')return '';let t;if(typeof v==='number'){t=nd!=null?v.toFixed(nd):String(Number(v.toPrecision(4)));if(nd==null)t=t.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');}else t=String(v);return fa(t).replace(/^\u200f/,'');}
function parseNumber(text){if(text==null)return null;let t=String(text).trim().replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/[٫/،,]/g,'.');let n=Number(t);return Number.isFinite(n)?n:null;}
function groupOf(c){return [0,1].includes(c)?'01':[2,3].includes(c)?'23':'45'}
function getCtx(){
  const p=state.profile, a=state.answers, climate=state.climate.climate;
  const eq=new Set(p.equipment||[]), spaces=new Set(p.spaces||[]);
  const ctx={climate,p,a,equipment:{has:k=>eq.has(k)},spaces:{has:k=>spaces.has(k)},
    flag:k=>p[k]===true,n:k=>typeof p[k]==='number'?Number(p[k]):0,ans:k=>a[k],
    get area(){return this.n('area')}, get vent(){return this.n('vent_area')}, get use(){return p.use}, get hvac(){return p.hvac},
    get is_res(){return p.use==='res'}, get nonres(){return p.use!=null&&p.use!=='res'}, get continuous(){return ['res','medical','hotel'].includes(p.use)},
    get demand(){return p.demand==='demand'}, get central(){return p.hvac==='central'},
    get small_central(){return this.central&&!this.central_required}, get central_any(){return this.central||this.flag('dhw_central')},
    get central_required(){return this.is_res ? (this.n('units')>30||this.vent>3000) : this.vent>3000},
    get zoning_required(){return this.is_res ? (this.area>3000||this.n('floors')>5) : this.area>5000},
    get bms_ems_required(){return this.is_res ? (this.area>5000||this.n('floors')>9) : this.area>10000},
    get group(){return groupOf(climate)}, get iy(){return Number(p.impl_year)||0}, get bg(){return p.bgroup||''},
  }; return ctx;
}
function safeExpr(expr,ctx){if(!expr)return true;try{return !!Function('ctx','"use strict"; return ('+expr+');')(ctx)}catch(e){console.warn('expr',expr,e);return false}}
function qApplies(q,ctx){return safeExpr(q.applies_js,ctx)}
function itemApplies(it,ctx){return !it.applies_js||safeExpr(it.applies_js,ctx)}
function resolveLimit(q,ctx){
  if(q.limit_ref==='shgc_limit') return shgcLimit(ctx);
  if(q.limit_ref==='dla_limit') return dlaLimit(ctx);
  if(Array.isArray(q.limit)) return q.limit[ctx.climate];
  return q.limit;
}
function shgcLimit(ctx){
  const pf=ctx.ans('gl_pf'); if(typeof pf!=='number') return null;
  const key=pf<20?'lt20':pf<=50?'20_50':pf<=70?'50_70':'gt70';
  return MODEL.constants.SHGC_TBL[key][ctx.climate];
}
function dlaLimit(ctx){
  if(ctx.use==='office') return ctx.area<2000?20:40;
  if(ctx.use==='commercial') return ctx.area<2000?10:20;
  if(ctx.use==='educational') return 45;
  if(ctx.use==='warehouse') return 50;
  return null;
}
function hintText(q,ctx){
  if(q.hint_ref==='shgc_hint'){const lim=shgcLimit(ctx);return lim==null?'ابتدا مقدار PF را وارد کنید تا حد مجاز SHGC برای اقلیم شما محاسبه شود.':'با PF وارد‌شده و اقلیم شما، حداکثر SHGC مجاز برابر '+lim+' است.';}
  if(q.hint_ref==='re_hint'){return ctx.area?'با مساحت کل '+Math.floor(ctx.area)+' m²، حداقل توان تجدیدپذیر ≈ '+Math.round(ctx.area*6/1000*10)/10+' kW خواهد بود.':'';}
  if(q.hint_ref && q.id==='l_dla'){const lim=dlaLimit(ctx);return lim!=null?'حداقل DLA برای کاربری و مساحت شما: '+lim+'٪':'';}
  return '';
}
function compare(v,op,lim){const e=1e-9;if(op==='>=')return v>=lim-e;if(op==='<=')return v<=lim+e;if(op==='<')return v<lim-e;if(op==='>')return v>lim+e;throw new Error(op)}
function evalQ(q,ctx){
  const a=state.answers[q.id];
  if(q.kind==='auto') return q.compute_js ? (safeExpr(q.compute_js,ctx)?'pass':'fail') : 'pass';
  if(a===NA)return 'na'; if(a==null)return 'unanswered';
  if(q.kind==='yn')return q.rule[String(!!a)];
  if(q.info)return 'info';
  const lim=resolveLimit(q,ctx); if(lim==null)return 'unanswered';
  return compare(a,q.op,lim)?'pass':'fail';
}
function limitText(q,ctx){
  if(q.kind!=='num'||q.info)return '';

}
/* ---- Phase-in schedule (booklet table 19-2-1): which requirements are mandatory per building group (a-d) and implementation year (1-5).
   Each string has 24 columns, in this order: 0-2 inspection (design, construction, completion); 3 opaque insulation; 4 facade reflectance; 5 roof reflectance;
   6 multi-pane glass; 7 minimum thermal resistance of glazing; 8 SHGC; 9 facade air-leak test; 10 volumetric air-leak test; 11 heat recovery; 12 equipment efficiency;
   13 plant-room control; 14 control valves and flow meters; 15 four-pipe system; 16 primary/secondary circuit; 17 variable-speed pump; 18 smart lighting; 19 EV charger;
   20 monitoring; 21 sub-monitoring; 22 BMS; 23 renewable energy. "1" = mandatory, "0" = not mandatory (default full score, no questions). */
const SCHED={"a": ["000100100000000000000000", "000100100000100000000000", "000100100000110000000000", "000100110000110000001001", "000111111001110000001101"], "b": ["000100100000000000000000", "101100100000110000000000", "111100110000110000011001", "111111111001110000011101", "111111111111111001111101"], "c": ["101100110000110000000000", "111111111011110001011001", "111111111111111111111111", "111111111111111111111111", "111111111111111111111111"], "d": ["111111111111111111111101", "111111111111111111111111", "111111111111111111111111", "111111111111111111111111", "111111111111111111111111"]};

const BG_LABEL={a:'الف',b:'ب',c:'ج',d:'د'};
/* Mapping of checklist questions to table columns. A question is asked when ANY of its columns is mandatory. Order of lookup: question, item, then the table section of the app section. */
const SCHED_Q={};
[['u_fixed u_movable u_door u_sky',[7]],['gl_pf gl_shgc shgc_sky',[8]],['air_test',[9]],['air_leak',[10]],['m_recovery m_flue_rec m_flue_gas m_ahu_rec',[11]],['ms_1',[13]],
 ['cc_valve_floor cc_valve_zone cc_valve_hours cc_valve_common cc_fcu_valve cc_ball_ddc',[14]],['cc_4pipe',[15]],['cc_vfd cc_pump_cool cc_pump_heat cc_soft',[17]],
 ['e_ev_infra e_ev_62 e_ev_83 e_ev20 e_ev10',[19]],['mo_1 mo_6 mo_7 mg_1',[20]],['mo_2 mo_3 mo_4 mo_5 mg_2 mg_3 mg_4 mg_5 mg_6 mc_1 mc_2 mc_3 mc_4 mc_5 mc_6 mc_7 mc_8 mc_9 mc_10',[21]],
 ['mc_16 mc_17',[20,21,22]],['roof_reflect',[5]],['facade_reflect',[4]]].forEach(([ids,c])=>ids.split(' ').forEach(i=>SCHED_Q[i]=c));
const SCHED_ITEM={ins:[3],meq:[12],elms:[18],re:[23],bms:[22]};
const SCHED_SUB={opaque:[3,4,5],glazing:[6,7,8],air:[9,10],prod:[11,12,13,14,15,16,17],dist:[11,12,13,14,15,16,17],edist:[18,19],elight:[18,19],elms:[18,19],ren:[23],mon:[20,21,22],bms:[22]};
const ITEM_SUB={},ITEM_BY_ID={};MODEL.sections.forEach(sec=>sec.subs.forEach(sub=>sub.items.forEach(it=>{ITEM_SUB[it.id]=sub.id;ITEM_BY_ID[it.id]=it})));
function schedOn(ctx){return ctx.iy>=1&&ctx.iy<=5&&!!SCHED[ctx.bg]}
function schedBits(ctx){return SCHED[ctx.bg][ctx.iy-1]}
function qRequired(q,it,ctx){
  if(!schedOn(ctx))return true;
  const cols=SCHED_Q[q.id]||SCHED_ITEM[it.id]||SCHED_SUB[ITEM_SUB[it.id]];
  if(!cols)return true;

}
function itemAll(it,ctx){return it.questions.filter(q=>qApplies(q,ctx))}
function itemQuestions(it,ctx){return itemAll(it,ctx).filter(q=>qRequired(q,it,ctx))}
function itemBase(it,ctx){return Number(it.w[ctx.group]||0)}
function itemActive(it,ctx){return itemBase(it,ctx)>0&&itemApplies(it,ctx)&&itemAll(it,ctx).length>0}
function itemAsked(it,ctx){return itemActive(it,ctx)&&itemQuestions(it,ctx).length>0}
function compute(){
  const ctx=getCtx(); const gate=state.gate.gate===true;
  const res={gate,climate:ctx.climate,group:ctx.climate==null?null:ctx.group,sections:[],total:0,mandatory_failed:[],accepted:false};

    const w=Number(sec.w[ctx.group]||0); const items=[];

    const act=items.filter(([sub,it])=>itemActive(it,ctx)); const denom=act.reduce((s,[sub,it])=>s+itemBase(it,ctx),0);
    const rs={id:sec.id,title:sec.title,weight:w,score:0,items:[],na:false};

  const badges=[];if(q.only)badges.push(`<span class="badge climate">⚠ ویژه اقلیم ${q.only.map(String).map(escapeText).join('، ')}</span>`);else if(q.climate_dep)badges.push('<span class="badge climate">⚠ حد مجاز وابسته به اقلیم دقیق پروژه</span>');if(q.optional)badges.push('<span class="badge info">اختیاری</span>');

    /* Automatic download only on devices with a mouse: phones/tablets need a real tap on the link, because the browser drops the user gesture during the long rendering */
    if(!matchMedia('(pointer:coarse)').matches){const a=document.createElement('a');a.href=state.pdfUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
    toast(state.reportMeta&&state.reportMeta.local?'فایل PDF آماده است. توجه: QR فقط وقتی با گوشی کار می‌کند که برنامه روی آدرس اینترنتی باشد.':'فایل PDF آماده است.');
  }catch(e){console.error(e);showPdfFail(btn,e);toast('تهیه مستقیم PDF انجام نشد'+(e&&e.name?' ('+e.name+')':'')+'.')}
  finally{btn.disabled=false;btn.textContent=label}
}
function restart(){if(confirm('همه پاسخ‌ها پاک شود و ارزیابی از ابتدا آغاز گردد؟')){state.project={};state.gate={};state.climate={};state.profile={};state.answers={};state.lastResult=null;state.lastHtml='';state.cur='info';state.shared=false;state.reportDay=null;state.reportMeta=null;document.body.classList.remove('shared-view');if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderCurrent()}}
function renderCurrent(){state.steps=buildSteps();const step=currentStep();setMsg('');if(step.type==='info')renderInfo();else if(step.type==='gate')renderGate();else if(step.type==='climate')renderClimate();else if(step.type==='profile')renderProfile(step.index);else if(step.type==='item')renderItem(step);else renderResult();refreshHeader()}
function goNext(){if(!validateCurrent())return;state.steps=buildSteps();const i=state.steps.findIndex(s=>s.key===state.cur);if(i<0||i+1>=state.steps.length){setMsg('برای ادامه، پاسخ‌های این مرحله را کامل کنید.');return}state.cur=state.steps[i+1].key;renderCurrent();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));}
function goPrev(){state.steps=buildSteps();const i=state.steps.findIndex(s=>s.key===state.cur);if(i>0){state.cur=state.steps[i-1].key;renderCurrent()}}
$('#nextBtn').onclick=goNext;$('#prevBtn').onclick=goPrev;
function attachImages(){document.querySelectorAll('[data-image-toggle]').forEach(btn=>btn.onclick=()=>{const el=document.getElementById(btn.dataset.imageToggle);el.classList.toggle('open')});document.querySelectorAll('.ref-image').forEach(img=>img.onclick=()=>openImage(img.dataset.imageSrc,img.dataset.imageTitle))}
let zoom=1,fitMode=true;function openImage(name,title){$('#modalTitle').textContent=title;$('#modalImage').src=MODEL.images[name];$('#modalImage').alt=title;zoom=1;fitMode=true;$('#modalImage').style.transform='scale(1)';$('#imageModal').classList.add('open')}
$('#modalClose').onclick=()=>$('#imageModal').classList.remove('open');$('#imageModal').onclick=e=>{if(e.target.id==='imageModal')$('#imageModal').classList.remove('open')};$('#zoomIn').onclick=()=>{fitMode=false;zoom=Math.min(4,zoom*1.25);$('#modalImage').style.transform=`scale(${zoom})`};$('#zoomOut').onclick=()=>{fitMode=false;zoom=Math.max(.2,zoom*.8);$('#modalImage').style.transform=`scale(${zoom})`};$('#zoomFit').onclick=()=>{fitMode=true;zoom=1;$('#modalImage').style.transform='scale(1)'};

/* ---- Password gate shown when the app starts. Client-side only: it keeps casual visitors out but is not real security, because the code is readable in the page source. ---- */
const APP_PASSWORD='5357';
function passwordGate(done){
  const g=document.createElement('div');g.id='gate';
  g.innerHTML='<form class="gbox" autocomplete="off"><h2>ورود به چک‌لیست انرژی تجویزی</h2><p>لطفاً رمز عبور را وارد کنید.</p><input id="gatePw" type="password" inputmode="numeric" autocomplete="off" aria-label="رمز عبور" autofocus/><button class="btn primary" type="submit">ورود</button><div class="gerr" id="gateErr" role="alert"></div></form>';
  document.body.appendChild(g);
  const inp=g.querySelector('#gatePw'),err=g.querySelector('#gateErr');setTimeout(()=>inp.focus(),50);
  g.querySelector('form').onsubmit=e=>{e.preventDefault();
    if(inp.value.trim()===APP_PASSWORD){g.remove();done()}
    else{err.textContent='رمز عبور نادرست است.';inp.value='';inp.focus();g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}};
}
passwordGate(bootApp);
